services:
  # Unified Faculty Management Service (Frontend + Backend)
  - type: web
    name: faculty-management-system
    env: python
    buildCommand: ./build.sh
    startCommand: cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: NODE_VERSION
        value: 18.16.0
