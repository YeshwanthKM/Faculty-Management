services:
  # Backend FastAPI Service
  - type: web
    name: faculty-invigilation-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5

  # Frontend Static Site
  - type: static
    name: faculty-invigilation-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishDir: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: faculty-invigilation-backend
          property: url
        suffix: /api
